<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wellyngton Nascimento | Protótipo da abertura</title>
    <!-- Protótipo: não deixar o Google indexar esta página de teste -->
    <meta name="robots" content="noindex">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/prototipo.css">

    <!-- Import map: deixa o JS escrever "import ... from 'three'" e o navegador
         sabe buscar o Three.js direto da CDN, sem npm nem build. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body class="is-intro">

    <!-- Fundo de partículas (fixo, atrás de tudo) -->
    <canvas id="particulas" class="particulas" aria-hidden="true"></canvas>

    <!-- Cena 3D do notebook (fixa, por cima das partículas) -->
    <canvas id="cena3d" class="cena3d" aria-hidden="true"></canvas>

    <header class="topo">
        <span class="topo_logo">wellyngton<span class="topo_ponto">.dev</span></span>
        <nav class="topo_acoes" aria-label="Atalhos">
            <button type="button" class="topo_link" id="pularIntro">Pular intro <i class="fa-solid fa-forward" aria-hidden="true"></i></button>
            <a class="topo_link" href="../curriculo-Wellyngton.pdf" target="_blank" rel="noopener">CV</a>
        </nav>
    </header>

    <main id="intro" class="intro">
        <section class="hero" aria-labelledby="heroNome">
            <img class="hero_foto" src="../img/sobre-mim.jpg" alt="Foto de Wellyngton Nascimento" width="140" height="140">
            <h1 class="hero_nome" id="heroNome">Wellyngton Nascimento</h1>
            <p class="hero_cargo"><span>Estudante de Engenharia de Software</span><span class="hero_sep" aria-hidden="true"> · </span><span>Desenvolvedor Full Stack</span></p>
            <p class="hero_status"><span class="hero_pulso" aria-hidden="true"></span>Em busca de estágio</p>

            <ul class="hero_sociais">
                <li><a href="https://github.com/Wellyngton-Nascimento-Santos" target="_blank" rel="noopener" aria-label="GitHub"><i class="fa-brands fa-github" aria-hidden="true"></i></a></li>
                <li><a href="https://www.linkedin.com/in/wellyngton-nascimento-santos-44944322b/" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in" aria-hidden="true"></i></a></li>
                <li><a href="mailto:wellyngton.nsantos1910@gmail.com" aria-label="E-mail"><i class="fa-solid fa-envelope" aria-hidden="true"></i></a></li>
                <li><a href="../curriculo-Wellyngton.pdf" target="_blank" rel="noopener" aria-label="Currículo em PDF"><i class="fa-solid fa-file-arrow-down" aria-hidden="true"></i></a></li>
            </ul>

            <!-- Só aparece pra quem prefere menos movimento (ou navegador sem WebGL) -->
            <button type="button" class="hero_entrar" id="entrarDireto">Abrir portfólio <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
        </section>

        <!-- Espaço vazio que dá "distância de rolagem" pra animação do notebook -->
        <div class="trilha" aria-hidden="true"></div>
    </main>

    <div class="dica_scroll" aria-hidden="true">
        <span class="dica_mouse"><span class="dica_roda"></span></span>
        role para abrir o notebook
    </div>

    <!-- ================= INTERIOR: o "editor" dentro do notebook ================= -->
    <div class="editor" id="editor" hidden>
        <header class="ed_titulo">
            <div class="ed_janela">
                <button type="button" class="ed_bolinha ed_bolinha--fechar" id="sairNotebook" aria-label="Sair do notebook e voltar ao início"></button>
                <span class="ed_bolinha ed_bolinha--min" aria-hidden="true"></span>
                <span class="ed_bolinha ed_bolinha--max" aria-hidden="true"></span>
            </div>
            <span class="ed_nome">wellyngton.dev · portfolio</span>
            <a class="ed_cv" href="../curriculo-Wellyngton.pdf" target="_blank" rel="noopener"><i class="fa-solid fa-file-arrow-down" aria-hidden="true"></i> <span>Baixar CV</span></a>
        </header>

        <div class="ed_corpo">
            <nav class="ed_atividade" aria-hidden="true">
                <i class="fa-regular fa-copy ativo"></i>
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-code-branch"></i>
                <i class="fa-solid fa-cubes"></i>
            </nav>

            <aside class="ed_explorer" aria-label="Arquivos do portfólio">
                <p class="ed_explorer_titulo">Explorador</p>
                <p class="ed_pasta"><i class="fa-solid fa-chevron-down" aria-hidden="true"></i> portfolio</p>
                <ul class="ed_arvore" id="arvore"></ul>
            </aside>

            <section class="ed_principal">
                <div class="ed_abas" id="abas" role="tablist"></div>
                <div class="ed_codigo" id="codigo" tabindex="0" role="tabpanel"></div>
            </section>
        </div>

        <footer class="ed_status">
            <span><i class="fa-solid fa-code-branch" aria-hidden="true"></i> main</span>
            <span class="ed_status_ok"><span class="hero_pulso" aria-hidden="true"></span> disponível para estágio</span>
            <span class="ed_status_dir" id="statusLinguagem">Markdown</span>
            <span class="ed_status_dir">UTF-8</span>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
    <script src="js/particulas.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/intro3d.js"></script>
</body>
</html>
